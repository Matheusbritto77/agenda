services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agendae_app
    ports:
      - 8080:80
    volumes:
      - sqlite_data:/var/www/html/database
      - storage_data:/var/www/html/storage
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost:8080}
      - DB_CONNECTION=${DB_CONNECTION:-sqlite}
      - DB_DATABASE=${DB_DATABASE:-/var/www/html/database/database.sqlite}
    labels:
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.agenda-agenda-rqj9wg-16-web.rule=Host(`renttool.store`) || Host(`*.renttool.store`)
      - traefik.http.routers.agenda-agenda-rqj9wg-16-web.entrypoints=web
      - traefik.http.services.agenda-agenda-rqj9wg-16-web.loadbalancer.server.port=80
      - traefik.http.routers.agenda-agenda-rqj9wg-16-web.service=agenda-agenda-rqj9wg-16-web
      - traefik.http.routers.agenda-agenda-rqj9wg-16-web.middlewares=redirect-to-https@file
      - traefik.http.routers.agenda-agenda-rqj9wg-16-websecure.rule=Host(`renttool.store`) || Host(`*.renttool.store`)
      - traefik.http.routers.agenda-agenda-rqj9wg-16-websecure.entrypoints=websecure
      - traefik.http.services.agenda-agenda-rqj9wg-16-websecure.loadbalancer.server.port=80
      - traefik.http.routers.agenda-agenda-rqj9wg-16-websecure.service=agenda-agenda-rqj9wg-16-websecure
      - traefik.http.routers.agenda-agenda-rqj9wg-16-websecure.tls=true
      - traefik.enable=true
    restart: unless-stopped
    networks:
      - dokploy-network
      - default
volumes:
  sqlite_data: null
  storage_data: null
networks:
  dokploy-network:
    external: true
