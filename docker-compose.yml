services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agendae_app
    ports:
      - "8080:80"
    volumes:
      - sqlite_data:/var/www/html/database
      - storage_data:/var/www/html/storage
    networks:
      - easypanel
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://localhost:8080
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.agendae.rule=Host(`renttool.store`) || HostRegexp(`{subdomain:[a-z0-9-]+}.renttool.store`)"
      - "traefik.http.services.agendae.loadbalancer.server.port=80"
    restart: unless-stopped

networks:
  easypanel:
    external: true

volumes:
  sqlite_data:
  storage_data:
