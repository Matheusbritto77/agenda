<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Accent Spark Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Drop Shadow for Icon Details -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#312E81" flood-opacity="0.5" />
    </filter>

    <!-- Subtle Shine -->
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />
  
  <!-- Subtle Top Highlight -->
  <rect width="512" height="256" rx="116" fill="url(#shine)" />

  <!-- Calendar Container -->
  <g filter="url(#glow)">
    <!-- Calendar Body -->
    <rect x="106" y="128" width="300" height="276" rx="44" fill="#FFFFFF" />
    
    <!-- Calendar Top Header Strip -->
    <path d="M 106 172 C 106 147.7 125.7 128 150 128 L 362 128 C 386.3 128 406 147.7 406 172 L 406 208 L 106 208 Z" fill="#4338CA" />
    
    <!-- Binder Rings -->
    <rect x="176" y="96" width="28" height="60" rx="14" fill="#FFFFFF" stroke="#4338CA" stroke-width="6" />
    <rect x="308" y="96" width="28" height="60" rx="14" fill="#FFFFFF" stroke="#4338CA" stroke-width="6" />
    
    <!-- Grid Dots (Days) -->
    <circle cx="168" cy="254" r="14" fill="#E0E7FF" />
    <circle cx="232" cy="254" r="14" fill="#E0E7FF" />
    <circle cx="168" cy="314" r="14" fill="#E0E7FF" />
    <circle cx="232" cy="314" r="14" fill="#E0E7FF" />
    <circle cx="168" cy="364" r="14" fill="#E0E7FF" />
    
    <!-- Checkmark Circle Badge (Dynamic Appointment Confirmation) -->
    <circle cx="316" cy="314" r="54" fill="url(#accentGrad)" filter="drop-shadow(0 6px 12px rgba(245, 158, 11, 0.45))" />
    
    <!-- Checkmark Icon -->
    <path d="M 294 314 L 308 328 L 340 296" fill="none" stroke="#1E1B4B" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
